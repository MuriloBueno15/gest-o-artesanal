<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Artesanal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Sistema de Gestão Artesanal</h1>

<h2>Menu Principal</h2>

<div class="menu">

    <p>Bem-vindo ao sistema de Gestão Artesanal!</p>
    <button type="button" id="btnCadastrar">Cadastrar Produto</button>
    <button type="button" id="btnEstoque">Consultar estoque</button>
    <button type="button" id="btnVendas">Registrar Venda</button>
</div>

<h2> Cadastro de Produtos</h2>
<form id="formCadastro">
    <div class="campo">
        <label for="nome">Nome do produto:</label>
        <input type="text" id="nome" name="nome" required>
    </div>
    <div class="campo">
        <label for="preco">Preço do Produto:</label>
        <input type="number" id="preco" name="preco" step="0.01" min="0" required>
    </div>
    <div class="campo">
        <label for="quantidade"> Quantidade:</label>
        <input type="number" id="quantidade" name="quantidade" min="0" step="1" required>
    </div>

    <button type="submit" id="btnSalvar">Salvar Produto</button>
    <button type="button" id="btnCancelar">Cancelar Edição</button>
</form>

<section id="secaoVendas">
    <h2>Registrar Venda</h2>
    <form id="formVendas">
        <div class="campo">
            <lavel for="produtoVenda">Selecione o produto:</lavel>
            <select id="produtoVenda" required>
                <option value="">Selecione um produto</option>
            </select>
        </div>
        <div class="campo">
            <label for="quantidadeVenda">Quantidade vendida:</label>
            <input
                    type="number"
                    id="quantidadeVenda"
                    min="1"
                    step="1"
                    required
            >
        </div>
        <button type="submit" id="confirmarVenda">
            Confirmar Venda
        </button>
    </form>
</section>

<section id="secaoEstoque">
    <h2>Estoque de Produtos</h2>
    <div id="totalProdutos" class="resumo-estoque"></div>
    <div id="listaProdutos"></div>
</section>


<section id="secaoRelatorios" class="painel-relatorios">
    <h2>Relatórios de Vendas</h2>
    <div class="grid-faturamento">
    <p id="faturamentoDiario" class="card-faturamento">
        Faturamento de hoje: R$ 0,00
    </p>
    <p id="faturamentoMensal" class="card-faturamento" >
        Faturamento mensal: R$ 0,00
    </p>

    <p id="faturamentoSemanal" class="card-faturamento">
        Faturamento semanal: R$ 0,00
    </p>
    </div>
    <h3>Gráfico de Vendas</h3>

    <canvas id="graficoVendas"></canvas>
</section>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>
</body>
</html>
